name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # Skip postinstall rebuild — CI runners lack VS Build Tools for bufferutil/utp-native.
        # package.json build.npmRebuild is already false; prebuilds ship with the packages.
        run: npm ci --ignore-scripts

      - name: Build & publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npm run build &&
          npx electron-builder --win
          --publish ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'false' && 'never' || 'always' }}
